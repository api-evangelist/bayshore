name: Bayshore
description: >-
  Bayshore (bayshore AI GmbH) is a Munich-based legal and compliance technology
  company building an agentic AI platform that turns any ruleset — from sector
  regulations to internal corporate policies — into deterministic, machine-readable
  guardrails for AI agents. Positioned as a "Legal & Compliance Front Door," the
  platform handles incoming requests from business teams, auto-clears low-risk
  cases with instant responses, escalates complex matters to human reviewers, and
  maintains audit-ready documentation for every decision. Founded in 2024 by Paul
  F. Welter, Philipp Wiegand, and Erik Krauter, the company focuses on highly
  regulated industries including finance (MaRisk, DORA, NIS2), pharma, defense
  (export controls, sanctions), and cross-industry programs (GDPR, anti-bribery,
  antitrust, third-party due diligence). Bayshore raised an $8M seed round led by
  Earlybird Venture Capital in 2026. This profile currently exposes no public API,
  developer portal, or specifications.
